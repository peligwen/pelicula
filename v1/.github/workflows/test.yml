# Workflow for the v1 rescope. GitHub only reads workflows from the repository
# root's .github/, so this file must live there (or v1/ must become the root)
# to run. Every step uses working-directory v1 because the old tree still
# shares the repository.
name: v1 test

on:
  push:
    branches: [main]
    paths:
      - 'v1/**'
  pull_request:
    branches: [main]
    paths:
      - 'v1/**'

defaults:
  run:
    working-directory: v1

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v1/go.mod
          cache-dependency-path: v1/go.sum
      - name: gofmt
        working-directory: v1
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        working-directory: v1
        run: go vet ./...
      - name: staticcheck
        working-directory: v1
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: go test (race, coverage)
        working-directory: v1
        run: go test -race -cover ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck wrapper
        working-directory: v1
        run: shellcheck -S warning pelicula

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v1/go.mod
          cache-dependency-path: v1/go.sum
      - name: docker compose plugin
        working-directory: v1
        run: |
          docker version
          docker compose version
      - name: integration test
        working-directory: v1
        run: make e2e
