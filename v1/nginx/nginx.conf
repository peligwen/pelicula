# Pelicula reverse proxy. LAN-only, HTTP on container port 80 (host :7354).
#
# Two nginx rules shape this file:
#   * add_header / proxy_set_header set in a location REPLACE (not extend) the
#     ones inherited from the server block. Locations that need their own
#     add_header therefore repeat the full set, and every proxied location
#     repeats the proxy_set_header block.
#   * Upstreams that live in gluetun's network namespace (prowlarr, qbittorrent)
#     are reached with `set $var; proxy_pass $var;` so nginx resolves them at
#     request time and still starts when the vpn profile is off.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50m;   # *arr UIs accept backup uploads; tightened below for auth + webhook
    server_tokens off;

    # WebSocket upgrade map (sonarr, radarr, prowlarr, qbt, jellyfin).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Host as the client sent it, port included (e.g. localhost:7354). $host drops the
    # port, which would make a browser's Origin (localhost:7354) differ from the Host the
    # server sees and trip its same-origin CSRF check on every POST/PUT/DELETE.
    map $http_host $pelicula_host {
        default $http_host;
        ''      $host;
    }

    # Content-Security-Policy for the dashboard and the API. The proxied
    # third-party UIs (*arr, qBittorrent, Jellyfin) ship their own CSP and
    # need inline script, so they are exempt: an empty value makes add_header
    # skip the header. $request_uri is used because $uri changes on rewrite.
    map $request_uri $pelicula_csp {
        default "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
        "~^/(sonarr|radarr|prowlarr|qbt|jellyfin)([/?]|$)" "";
    }

    # Login / registration: 10 requests per minute per client IP.
    limit_req_zone $binary_remote_addr zone=peli_auth:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;
        resolver 127.0.0.11 valid=30s;
        absolute_redirect off;   # nginx listens on 80 inside the container; never leak that port

        # Inherited by every proxied location (none of which sets add_header).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy $pelicula_csp always;

        # Single-value directives inherited by every proxied location.
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;

        # ── Dashboard static files ───────────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            # server-level security headers, repeated (see top of file)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
            add_header Content-Security-Policy $pelicula_csp always;
        }

        # /register is public; serve register.html (query string, e.g. ?code=, is kept)
        # and let the static location above add the headers.
        location = /register {
            rewrite ^ /register.html last;
        }

        # ── Auth subrequest (internal only) ──────────────────────────────
        # auth_request calls this with the original request's cookies.
        # 204 = allow, 401 = no session (redirect to login), 403 = signed in
        # but below the required role. The gated upstreams are the Sonarr,
        # Radarr, Prowlarr and qBittorrent UIs, which run with their own auth
        # off, so the bar is admin: viewers and managers use the dashboard.
        location = /auth-check {
            internal;
            set $args min=admin;
            proxy_pass http://pelicula:8181/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
        }

        # auth_request 401 -> back to the dashboard with the login overlay open.
        location @login_redirect {
            return 302 /?login=1;
        }

        # ── Rate-limited auth endpoints ──────────────────────────────────
        location = /api/auth/login {
            limit_req zone=peli_auth burst=5 nodelay;
            client_max_body_size 8k;
            proxy_pass http://pelicula:8181;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
        }

        location = /api/register {
            limit_req zone=peli_auth burst=3 nodelay;
            client_max_body_size 8k;
            proxy_pass http://pelicula:8181;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
        }

        # ── *arr -> pelicula import webhook: private networks only ───────
        # (the server also checks X-Webhook-Secret; this is defence in depth)
        location = /api/hooks/import {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            client_max_body_size 1m;
            proxy_pass http://pelicula:8181;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
        }

        # ── Pelicula API (includes /api/health, polled by the CLI) ───────
        location /api/ {
            proxy_pass http://pelicula:8181;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
        }

        # ── Sonarr (UrlBase /sonarr) — session required ──────────────────
        location /sonarr {
            auth_request /auth-check;
            error_page 401 = @login_redirect;
            proxy_pass http://sonarr:8989;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ── Radarr (UrlBase /radarr) — session required ──────────────────
        location /radarr {
            auth_request /auth-check;
            error_page 401 = @login_redirect;
            proxy_pass http://radarr:7878;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ── Prowlarr (UrlBase /prowlarr, on gluetun's network) ───────────
        location /prowlarr {
            auth_request /auth-check;
            error_page 401 = @login_redirect;
            set $prowlarr_upstream http://gluetun:9696;
            proxy_pass $prowlarr_upstream;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ── qBittorrent (no UrlBase: strip /qbt/, on gluetun's network) ──
        location = /qbt {
            return 302 /qbt/;
        }

        location /qbt/ {
            auth_request /auth-check;
            error_page 401 = @login_redirect;
            # `set` must come before `rewrite ... break`, which ends rewrite-module processing.
            set $qbt_upstream http://gluetun:8080;
            rewrite ^/qbt/(.*)$ /$1 break;
            proxy_pass $qbt_upstream;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ── Jellyfin (BaseUrl /jellyfin) — not gated, it has its own login ─
        location /jellyfin {
            proxy_pass http://jellyfin:8096;
            proxy_set_header Host $pelicula_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $pelicula_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            # Long timeouts so paused playback and slow seeks are not cut at 60s.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
